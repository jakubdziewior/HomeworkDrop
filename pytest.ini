[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: testy jednostkowe pojedynczych funkcji/schematów (bez HTTP i bazy)
    integration: testy integracyjne pełnego obiegu przez API (HTTP + baza + dysk)
    security: testy scenariuszy ataków (upload, Mass Assignment, JWT)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore::jwt.warnings.InsecureKeyLengthWarning
