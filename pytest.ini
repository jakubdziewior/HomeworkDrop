[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    unit: testy jednostkowe pojedynczych funkcji i walidacji (bez HTTP i bazy)
    integration: testy integracyjne wielu współpracujących modułów (HTTP + baza + dysk)
    security: testy scenariuszy bezpieczeństwa (upload, Mass Assignment, JWT, RBAC)
    endpoint: testy podstawowej dostępności endpointów
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore::jwt.warnings.InsecureKeyLengthWarning
